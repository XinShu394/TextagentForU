<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextAgent · 速记</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  warm: { 50:'#fdf8f6',100:'#f2e8e5',200:'#eaddd7',300:'#e0cfc7',400:'#d2bab0',500:'#bfa094',600:'#a18072',700:'#977669',800:'#846358',900:'#43302b' }
}}}}
</script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fdf8f6; }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.note-enter { animation: slideUp 0.35s ease both; }
</style>
</head>
<body class="pb-20" x-data="notesApp()" x-init="load()">

  <!-- 顶栏 -->
  <div class="sticky top-0 z-10 bg-white/92 backdrop-blur-md border-b border-warm-100">
    <div class="px-4 py-3">
      <h1 class="text-lg font-bold text-warm-900">📝 速记</h1>
    </div>
    <!-- Tab 切换 -->
    <div class="flex border-b border-warm-100">
      <button @click="switchTab('notes')" class="flex-1 py-2.5 text-sm font-medium transition border-b-2"
        :class="tab==='notes' ? 'text-warm-800 border-warm-700' : 'text-warm-400 border-transparent'">速记</button>
      <button @click="switchTab('misc')" class="flex-1 py-2.5 text-sm font-medium transition border-b-2"
        :class="tab==='misc' ? 'text-warm-800 border-warm-700' : 'text-warm-400 border-transparent'">碎碎念</button>
    </div>
    <!-- 搜索栏 -->
    <div class="px-4 py-2" x-show="!loading && allNotes.length > 0">
      <div class="relative">
        <input type="text" x-model="searchQuery" @input.debounce.300ms="filterNotes()"
          class="w-full pl-8 pr-3 py-2 text-sm bg-warm-50 border border-warm-100 rounded-xl outline-none focus:border-warm-400 focus:bg-white transition"
          placeholder="搜索速记内容...">
        <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-warm-400 text-xs">🔍</span>
        <button x-show="searchQuery" @click="searchQuery=''; filterNotes()"
          class="absolute right-2.5 top-1/2 -translate-y-1/2 text-warm-400 hover:text-warm-600 text-sm">✕</button>
      </div>
    </div>
  </div>

  <!-- 加载状态 -->
  <div x-show="loading" class="p-4 space-y-3 animate-pulse">
    <div class="h-6 bg-warm-100 rounded w-20"></div>
    <div class="bg-warm-100 rounded-xl h-24"></div>
    <div class="bg-warm-100 rounded-xl h-20"></div>
    <div class="bg-warm-100 rounded-xl h-28"></div>
  </div>

  <!-- 空状态 -->
  <div x-show="!loading && allNotes.length === 0" class="text-center py-16 px-4">
    <p class="text-4xl mb-3" x-text="tab==='misc' ? '💭' : '📭'"></p>
    <p class="text-warm-600 font-medium" x-text="tab==='misc' ? '还没有碎碎念' : '还没有速记'"></p>
    <p class="text-warm-400 text-sm mt-1" x-text="tab==='misc' ? '碎碎念是你的私密空间' : '去企微和 TextAgent 聊天吧'"></p>
    <p class="text-warm-400 text-xs mt-3">💡 试试说：「记一下今天面试很顺利」</p>
  </div>

  <!-- 搜索无结果 -->
  <div x-show="!loading && allNotes.length > 0 && displayNotes.length === 0" class="text-center py-12">
    <p class="text-3xl mb-2">🔍</p>
    <p class="text-warm-500 text-sm">没有找到匹配的内容</p>
  </div>

  <!-- 笔记时间线 -->
  <div class="px-4 pt-2 pb-4 space-y-2" x-show="!loading && displayNotes.length > 0">
    <template x-for="(group, gi) in groupedNotes" :key="group.date">
      <div>
        <!-- 日期分隔 -->
        <div class="flex items-center gap-3 my-3 px-1">
          <div class="flex-1 h-px bg-warm-200"></div>
          <span class="text-xs font-semibold text-warm-500 bg-warm-50 px-3 py-1 rounded-full border border-warm-200"
            x-text="formatDateLabel(group.date)"></span>
          <div class="flex-1 h-px bg-warm-200"></div>
        </div>
        <!-- 该日期的笔记 -->
        <template x-for="(note, ni) in group.notes" :key="group.date + '-' + ni">
          <div class="note-enter bg-white rounded-xl p-4 shadow-sm mb-2"
            :class="tab==='misc' ? 'border-l-3 border-blue-200' : ''"
            :style="'animation-delay:' + (ni * 40) + 'ms'">
            <div class="flex items-center gap-2 mb-1.5">
              <span class="w-1.5 h-1.5 rounded-full shrink-0"
                :class="tab==='misc' ? 'bg-blue-300' : 'bg-warm-400'"></span>
              <span class="text-xs text-warm-400" x-text="note.time.slice(11)"></span>
            </div>
            <div class="text-sm text-warm-800 leading-relaxed whitespace-pre-wrap break-words" x-html="renderContent(note.content)"></div>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- 加载更多 -->
  <div class="px-4 pb-4" x-show="hasMore && !loading">
    <button @click="loadMore()"
      class="w-full py-2.5 bg-white border border-warm-200 rounded-xl text-sm text-warm-600 shadow-sm hover:shadow-md active:bg-warm-50 transition"
      :disabled="loadingMore">
      <span x-show="!loadingMore">加载更多</span>
      <span x-show="loadingMore" class="text-warm-400">加载中...</span>
    </button>
  </div>

  <!-- 统计信息 -->
  <div x-show="!loading && total > 0" class="text-center pb-4">
    <p class="text-xs text-warm-400">
      共 <span x-text="total"></span> 条<span x-show="searchQuery"> · 筛选 <span x-text="displayNotes.length"></span> 条</span>
    </p>
  </div>

  <!-- 版本信息 -->
  <div id="ver-info" class="text-center py-2 text-xs text-warm-400"></div>

  <!-- 底部导航 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-warm-100 flex justify-around py-2 text-xs z-10">
    <a href="/web/dashboard" class="flex flex-col items-center text-warm-400"><span class="text-lg">📊</span>概览</a>
    <a href="/web/notes" class="flex flex-col items-center text-warm-700 font-medium"><span class="text-lg">📝</span>速记</a>
    <a href="/web/todos" class="flex flex-col items-center text-warm-400"><span class="text-lg">✅</span>待办</a>
    <a href="/web/daily" class="flex flex-col items-center text-warm-400"><span class="text-lg">📖</span>日记</a>
    <a href="/web/archive" class="flex flex-col items-center text-warm-400"><span class="text-lg">📁</span>笔记</a>
  </nav>

<script>
const API_HEADERS = () => ({'X-Token': localStorage.getItem('textagent_token')||''});
function checkAuth() { if(!localStorage.getItem('textagent_token')) location.href='/web/login'; }

function notesApp() {
  return {
    tab: 'notes',
    loading: true,
    loadingMore: false,
    allNotes: [],
    displayNotes: [],
    total: 0,
    hasMore: false,
    offset: 0,
    LIMIT: 50,
    searchQuery: '',

    get groupedNotes() {
      const groups = [];
      let lastDate = null;
      for (const n of this.displayNotes) {
        const d = n.time.slice(0, 10);
        if (d !== lastDate) {
          lastDate = d;
          groups.push({ date: d, notes: [] });
        }
        groups[groups.length - 1].notes.push(n);
      }
      return groups;
    },

    switchTab(t) {
      this.tab = t;
      this.searchQuery = '';
      this.load();
    },

    async load() {
      checkAuth();
      this.loading = true;
      this.offset = 0;
      this.allNotes = [];
      this.displayNotes = [];
      await this.fetchPage(false);
      this.loading = false;
    },

    async fetchPage(append) {
      const endpoint = this.tab === 'misc' ? '/api/misc' : '/api/notes';
      const url = `${endpoint}?limit=${this.LIMIT}&offset=${this.offset}`;
      try {
        const r = await fetch(url, {headers: API_HEADERS()});
        if (r.status === 401) { localStorage.removeItem('textagent_token'); location.href='/web/login'; return; }
        const d = await r.json();
        const notes = d.notes || [];
        this.total = d.total || 0;
        this.hasMore = d.has_more || false;
        if (append) {
          this.allNotes = [...this.allNotes, ...notes];
        } else {
          this.allNotes = notes;
        }
        this.offset = this.allNotes.length;
        this.filterNotes();
      } catch(e) { console.error(e); }
    },

    async loadMore() {
      this.loadingMore = true;
      await this.fetchPage(true);
      this.loadingMore = false;
    },

    filterNotes() {
      if (!this.searchQuery.trim()) {
        this.displayNotes = [...this.allNotes];
        return;
      }
      const q = this.searchQuery.toLowerCase();
      this.displayNotes = this.allNotes.filter(n =>
        (n.content || '').toLowerCase().includes(q) ||
        (n.time || '').includes(q)
      );
    },

    formatDateLabel(d) {
      const now = new Date();
      const today = now.toISOString().slice(0, 10);
      const yd = new Date(now); yd.setDate(yd.getDate() - 1);
      const yesterday = yd.toISOString().slice(0, 10);
      if (d === today) return '今天';
      if (d === yesterday) return '昨天';
      if (d.slice(0, 4) === String(now.getFullYear())) {
        const parts = d.split('-');
        return parseInt(parts[1]) + ' 月 ' + parseInt(parts[2]) + ' 日';
      }
      return d;
    },

    renderContent(text) {
      if (!text) return '';
      let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      // Markdown 链接
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" class="text-indigo-500 underline break-all">$1</a>');
      // 裸 URL
      s = s.replace(/(?<!href=")(https?:\/\/[^\s<"&]+)/g, '<a href="$1" target="_blank" class="text-indigo-500 underline break-all">$1</a>');
      // 高亮搜索词
      if (this.searchQuery.trim()) {
        const q = this.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        s = s.replace(new RegExp(`(${q})`, 'gi'), '<mark class="bg-yellow-200 text-warm-900 rounded px-0.5">$1</mark>');
      }
      return s;
    }
  }
}
fetch('/api/version').then(r=>r.json()).then(d=>{
  const el=document.getElementById('ver-info');
  if(el&&d.version_name) el.textContent=d.version_name;
}).catch(()=>{});
</script>
</body>
</html>
