<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextAgent 架构流程图 (优化版)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0a0e27;
    color: #e0e6ff;
    min-height: 100vh;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 20px 20px;
    background: linear-gradient(180deg, #12183a 0%, #0a0e27 100%);
  }
  .header h1 {
    font-size: 2.4rem;
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .header p { color: #8892b0; font-size: 1.05rem; }

  /* Tab bar */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 0 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0a0e27cc;
    backdrop-filter: blur(12px);
  }
  .tab-btn {
    padding: 10px 28px;
    border: 1.5px solid #334155;
    border-radius: 999px;
    background: transparent;
    color: #94a3b8;
    font-size: .95rem;
    cursor: pointer;
    transition: all .25s;
  }
  .tab-btn:hover { border-color: #60a5fa; color: #60a5fa; }
  .tab-btn.active {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 0 20px #3b82f644;
  }

  /* Canvas wrapper */
  .canvas-wrap {
    display: none;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .canvas-wrap.active { display: block; }

  /* SVG common */
  svg { width: 100%; height: auto; }
  svg text {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    fill: #e0e6ff;
  }

  /* Flow 1 — Node styles */
  .node-user       { fill: #2563eb; }
  .node-channel    { fill: #7c3aed; }
  .node-gateway    { fill: #0891b2; }
  .node-brain      { fill: #dc2626; }
  .node-llm        { fill: #d97706; }
  .node-skill      { fill: #059669; }
  .node-storage    { fill: #4f46e5; }
  .node-reply      { fill: #be185d; }
  .node-decision   { fill: #ca8a04; }

  /* Flow 2 — Node styles */
  .node-server     { fill: #1d4ed8; }
  .node-scheduler  { fill: #9333ea; }
  .node-job        { fill: #0d9488; }
  .node-intent     { fill: #ea580c; }
  .node-rule       { fill: #b91c1c; }
  .node-action     { fill: #16a34a; }
  .node-push       { fill: #be185d; }

  /* Common shape styles */
  .diamond { stroke-linejoin: round; }
  .arrow-line {
    fill: none;
    stroke: #475569;
    stroke-width: 2;
    marker-end: url(#arrowhead);
  }
  .arrow-line.highlight {
    stroke: #60a5fa;
    stroke-width: 2.5;
  }
  .arrow-line.green { stroke: #34d399; }
  .arrow-line.orange { stroke: #fbbf24; }
  .arrow-line.red { stroke: #f87171; }
  .arrow-line.purple { stroke: #a78bfa; }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .85rem;
    color: #94a3b8;
  }
  .legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 3px;
  }

  /* Section title */
  .section-title {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 16px;
    color: #cbd5e1;
    letter-spacing: 1px;
  }

  /* Tooltip on hover */
  .node-group { cursor: pointer; }
  .node-group:hover rect,
  .node-group:hover polygon {
    filter: brightness(1.3) drop-shadow(0 0 8px rgba(96,165,250,.5));
    transition: filter .2s;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .header h1 { font-size: 1.6rem; }
    .tab-btn { padding: 8px 18px; font-size: .85rem; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>TextAgent For You · 架构流程图 (优化版)</h1>
  <p>个人 AI 生活助理系统 — 企业微信 × DeepSeek/Qwen × Obsidian</p>
  <p style="color:#64748b; font-size:0.9rem; margin-top:8px;">优化原则：简洁性、稳定性、可靠性 — 移除非核心冗余，强化数据隔离与容错机制</p>
</div>

<!-- Tab bar -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab(0)">📱 用户意图 → 反馈</button>
  <button class="tab-btn" onclick="switchTab(1)">☁️ 云服务器常态化运行</button>
</div>

<!-- ════════════════════════════════════════════════════════ -->
<!-- FLOW 1: 用户意图 → 反馈 (优化版) -->
<!-- ════════════════════════════════════════════════════════ -->
<div class="canvas-wrap active" id="flow1">
  <div class="section-title">用户意图 → 系统反馈 完整流程</div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#2563eb"></div>用户/入口</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7c3aed"></div>通道层</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0891b2"></div>网关层</div>
    <div class="legend-item"><div class="legend-dot" style="background:#dc2626"></div>大脑核心</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>LLM 模型</div>
    <div class="legend-item"><div class="legend-dot" style="background:#059669"></div>技能执行</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4f46e5"></div>存储层</div>
    <div class="legend-item"><div class="legend-dot" style="background:#be185d"></div>回复推送</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ca8a04"></div>决策节点</div>
  </div>

  <svg viewBox="0 0 1100 1500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
      </marker>
      <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
      </marker>
      <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
      </marker>
      <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f87171"/>
      </marker>
      <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/>
      </marker>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ═══ ROW 0: 用户 ═══ -->
    <g class="node-group" transform="translate(440,30)">
      <rect class="node-user" x="0" y="0" width="220" height="52" rx="26" opacity=".92"/>
      <text x="110" y="32" text-anchor="middle" font-size="15" font-weight="bold">👤 用户发送消息</text>
    </g>
    <text x="550" y="102" text-anchor="middle" font-size="11" fill="#64748b">文字 / 语音 / 图片</text>

    <!-- Arrow: 用户 → 企业微信 -->
    <line class="arrow-line highlight" x1="550" y1="82" x2="550" y2="120"/>

    <!-- ═══ ROW 1: 企业微信 ═══ -->
    <g class="node-group" transform="translate(420,120)">
      <rect class="node-channel" x="0" y="0" width="260" height="50" rx="10" opacity=".9"/>
      <text x="130" y="20" text-anchor="middle" font-size="13" font-weight="bold">📡 企业微信服务器</text>
      <text x="130" y="38" text-anchor="middle" font-size="11" fill="#c4b5fd">回调推送 → /wework 端点</text>
    </g>

    <!-- Arrow: 企微 → 网关 -->
    <line class="arrow-line highlight" x1="550" y1="170" x2="550" y2="205"/>

    <!-- ═══ ROW 2: 网关解密 + 去重 ═══ -->
    <g class="node-group" transform="translate(380,205)">
      <rect class="node-gateway" x="0" y="0" width="340" height="56" rx="10" opacity=".9"/>
      <text x="170" y="20" text-anchor="middle" font-size="13" font-weight="bold">🔐 消息网关 (app.py /wework)</text>
      <text x="170" y="40" text-anchor="middle" font-size="11" fill="#a5f3fc">XML解密 → 去重(60s) → UserContext隔离</text>
    </g>

    <!-- Arrow: 网关 → 异步转发 -->
    <line class="arrow-line highlight" x1="550" y1="261" x2="550" y2="295"/>

    <!-- ═══ ROW 3: 异步转发 (防超时) ═══ -->
    <g class="node-group" transform="translate(400,295)">
      <rect class="node-gateway" x="0" y="0" width="300" height="44" rx="8" opacity=".85"/>
      <text x="150" y="17" text-anchor="middle" font-size="12" font-weight="bold">⚡ 异步转发 → /process</text>
      <text x="150" y="35" text-anchor="middle" font-size="11" fill="#a5f3fc">200ms内返回 防超时</text>
    </g>

    <!-- Arrow: 异步 → handle_message -->
    <line class="arrow-line highlight" x1="550" y1="339" x2="550" y2="370"/>

    <!-- ═══ ROW 4: handle_message ═══ -->
    <g class="node-group" transform="translate(380,370)">
      <rect class="node-gateway" x="0" y="0" width="340" height="56" rx="10" opacity=".9"/>
      <text x="170" y="20" text-anchor="middle" font-size="13" font-weight="bold">📋 handle_message()</text>
      <text x="170" y="40" text-anchor="middle" font-size="11" fill="#a5f3fc">UserContext获取 → 新用户引导检查 → build_payload</text>
    </g>

    <!-- Arrow → 新用户判断 -->
    <line class="arrow-line highlight" x1="550" y1="426" x2="550" y2="460"/>

    <!-- ═══ ROW 5: 新用户引导? ═══ -->
    <g class="node-group" transform="translate(490,460)">
      <polygon class="diamond node-decision" points="60,0 120,35 60,70 0,35" opacity=".9"/>
      <text x="60" y="32" text-anchor="middle" font-size="11" font-weight="bold">新用户?</text>
      <text x="60" y="45" text-anchor="middle" font-size="10">Onboarding</text>
    </g>

    <!-- 新用户 → 引导 (右分支) -->
    <line class="arrow-line orange" x1="610" y1="495" x2="760" y2="495" marker-end="url(#arrowOrange)"/>
    <g class="node-group" transform="translate(760,475)">
      <rect class="node-skill" x="0" y="0" width="200" height="40" rx="8" opacity=".85"/>
      <text x="100" y="25" text-anchor="middle" font-size="12">🎓 3步引导流程</text>
    </g>
    <text x="680" y="488" font-size="10" fill="#fbbf24">是</text>

    <!-- 老用户 → brain.process (下) -->
    <line class="arrow-line highlight" x1="550" y1="530" x2="550" y2="565"/>
    <text x="560" y="550" font-size="10" fill="#60a5fa">否</text>

    <!-- ═══ ROW 6: brain.process ═══ -->
    <g class="node-group" transform="translate(370,565)">
      <rect class="node-brain" x="0" y="0" width="360" height="60" rx="12" opacity=".92" filter="url(#glow)"/>
      <text x="180" y="22" text-anchor="middle" font-size="14" font-weight="bold">🧠 brain.process() — 核心引擎</text>
      <text x="180" y="44" text-anchor="middle" font-size="11" fill="#fca5a5">per-user缓存 → Prompt构建 → 模型选择</text>
    </g>

    <!-- Arrow → 模型选择 -->
    <line class="arrow-line highlight" x1="550" y1="625" x2="550" y2="660"/>

    <!-- ═══ ROW 7: 模型路由 ═══ -->
    <g class="node-group" transform="translate(480,660)">
      <polygon class="diamond node-decision" points="70,0 140,42 70,84 0,42" opacity=".9"/>
      <text x="70" y="36" text-anchor="middle" font-size="11" font-weight="bold">模型路由</text>
      <text x="70" y="50" text-anchor="middle" font-size="10">select_tier</text>
    </g>

    <!-- Flash 路径 (左) -->
    <line class="arrow-line green" x1="480" y1="702" x2="240" y2="702" marker-end="url(#arrowGreen)"/>
    <line class="arrow-line green" x1="240" y1="702" x2="240" y2="740" marker-end="url(#arrowGreen)"/>
    <text x="350" y="695" font-size="10" fill="#34d399">简单消息</text>
    <g class="node-group" transform="translate(140,740)">
      <rect class="node-llm" x="0" y="0" width="200" height="48" rx="10" opacity=".9"/>
      <text x="100" y="18" text-anchor="middle" font-size="12" font-weight="bold">⚡ Flash (Qwen)</text>
      <text x="100" y="36" text-anchor="middle" font-size="10" fill="#fde68a">快速回复 / 闲聊</text>
    </g>

    <!-- Main 路径 (中) -->
    <line class="arrow-line highlight" x1="550" y1="744" x2="550" y2="780"/>
    <text x="560" y="768" font-size="10" fill="#60a5fa">常规请求</text>
    <g class="node-group" transform="translate(440,780)">
      <rect class="node-llm" x="0" y="0" width="220" height="48" rx="10" opacity=".9"/>
      <text x="110" y="18" text-anchor="middle" font-size="12" font-weight="bold">🔥 Main (DeepSeek)</text>
      <text x="110" y="36" text-anchor="middle" font-size="10" fill="#fde68a">技能调度 / 待办管理</text>
    </g>

    <!-- Think 路径 (右) -->
    <line class="arrow-line red" x1="620" y1="702" x2="870" y2="702" marker-end="url(#arrowRed)"/>
    <line class="arrow-line red" x1="870" y1="702" x2="870" y2="740" marker-end="url(#arrowRed)"/>
    <text x="740" y="695" font-size="10" fill="#f87171">深度分析</text>
    <g class="node-group" transform="translate(770,740)">
      <rect class="node-llm" x="0" y="0" width="200" height="48" rx="10" opacity=".9"/>
      <text x="100" y="18" text-anchor="middle" font-size="12" font-weight="bold">🤔 Think (DeepSeek R1)</text>
      <text x="100" y="36" text-anchor="middle" font-size="10" fill="#fde68a">主题深潜 / 深度回顾</text>
    </g>

    <!-- 三条路径汇聚 → JSON解析 -->
    <line class="arrow-line green" x1="240" y1="788" x2="240" y2="860" marker-end="url(#arrowGreen)"/>
    <line class="arrow-line highlight" x1="550" y1="828" x2="550" y2="860"/>
    <line class="arrow-line red" x1="870" y1="788" x2="870" y2="860" marker-end="url(#arrowRed)"/>
    <line class="arrow-line" x1="240" y1="860" x2="870" y2="860"/>
    <line class="arrow-line highlight" x1="550" y1="860" x2="550" y2="900"/>

    <!-- ═══ ROW 8: JSON 解析 ═══ -->
    <g class="node-group" transform="translate(400,900)">
      <rect class="node-brain" x="0" y="0" width="300" height="48" rx="10" opacity=".88"/>
      <text x="150" y="18" text-anchor="middle" font-size="13" font-weight="bold">📦 JSON 解析 + 步骤提取</text>
      <text x="150" y="38" text-anchor="middle" font-size="11" fill="#fca5a5">reply / steps[] / internal_steps[]</text>
    </g>

    <!-- Arrow → Agent Loop? -->
    <line class="arrow-line highlight" x1="550" y1="948" x2="550" y2="975"/>

    <!-- ═══ ROW 9: Agent Loop 判断 ═══ -->
    <g class="node-group" transform="translate(485,975)">
      <polygon class="diamond node-decision" points="65,0 130,38 65,76 0,38" opacity=".9"/>
      <text x="65" y="33" text-anchor="middle" font-size="11" font-weight="bold">有 internal</text>
      <text x="65" y="47" text-anchor="middle" font-size="10">steps?</text>
    </g>

    <!-- Agent Loop (右) -->
    <line class="arrow-line purple" x1="615" y1="1013" x2="760" y2="1013" marker-end="url(#arrowPurple)"/>
    <text x="670" y="1006" font-size="10" fill="#a78bfa">是</text>
    <g class="node-group" transform="translate(760,990)">
      <rect style="fill:#7c3aed" x="0" y="0" width="220" height="46" rx="8" opacity=".85"/>
      <text x="110" y="17" text-anchor="middle" font-size="12" font-weight="bold">🔄 Agent Loop (≤5轮)</text>
      <text x="110" y="35" text-anchor="middle" font-size="10" fill="#c4b5fd">文件搜索 → 再调LLM</text>
    </g>
    <path class="arrow-line purple" d="M 980,1013 Q 1010,1013 1010,950 Q 1010,900 870,900" marker-end="url(#arrowPurple)"/>

    <!-- 无 Agent Loop → 技能执行 -->
    <line class="arrow-line highlight" x1="550" y1="1051" x2="550" y2="1080"/>
    <text x="560" y="1070" font-size="10" fill="#60a5fa">否/完成</text>

    <!-- ═══ ROW 10: 技能执行 ═══ -->
    <g class="node-group" transform="translate(380,1080)">
      <rect class="node-skill" x="0" y="0" width="340" height="56" rx="10" opacity=".9"/>
      <text x="170" y="20" text-anchor="middle" font-size="13" font-weight="bold">⚙️ _execute_steps() 技能分发</text>
      <text x="170" y="42" text-anchor="middle" font-size="11" fill="#a7f3d0">V12 可见性检查 → handler(params, state, ctx)</text>
    </g>

    <!-- 存储交互 (右侧) -->
    <line class="arrow-line green" x1="720" y1="1108" x2="800" y2="1108" marker-end="url(#arrowGreen)"/>
    <g class="node-group" transform="translate(800,1080)">
      <rect class="node-storage" x="0" y="0" width="240" height="56" rx="10" opacity=".85"/>
      <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold">💾 本地存储 (LocalFileIO)</text>
      <text x="120" y="40" text-anchor="middle" font-size="10" fill="#a5b4fc">per-user 隔离 / 三级缓存</text>
    </g>
    <g transform="translate(800,1145)">
      <rect style="fill:#1e1b4b" x="0" y="0" width="240" height="70" rx="6" opacity=".5"/>
      <text x="120" y="18" text-anchor="middle" font-size="11" fill="#818cf8">三级缓存策略</text>
      <text x="16" y="38" font-size="10" fill="#a5b4fc">L1: 内存字典 (TTL 5min)</text>
      <text x="16" y="54" font-size="10" fill="#a5b4fc">L2/3: 文件持久化</text>
    </g>

    <!-- Arrow: 技能 → 回复路由 -->
    <line class="arrow-line highlight" x1="550" y1="1136" x2="550" y2="1245"/>

    <!-- ═══ ROW 11: 回复路由 ═══ -->
    <g class="node-group" transform="translate(470,1245)">
      <polygon class="diamond node-decision" points="80,0 160,46 80,92 0,46" opacity=".9"/>
      <text x="80" y="40" text-anchor="middle" font-size="11" font-weight="bold">回复路由</text>
      <text x="80" y="54" text-anchor="middle" font-size="10">_resolve_reply</text>
    </g>

    <!-- 简单回复 (左) -->
    <line class="arrow-line green" x1="470" y1="1291" x2="280" y2="1291" marker-end="url(#arrowGreen)"/>
    <text x="360" y="1284" font-size="10" fill="#34d399">简单结果</text>
    <g class="node-group" transform="translate(120,1271)">
      <rect class="node-reply" x="0" y="0" width="160" height="40" rx="8" opacity=".85"/>
      <text x="80" y="25" text-anchor="middle" font-size="12">📤 直接回复</text>
    </g>

    <!-- Flash 润色 (右) -->
    <line class="arrow-line orange" x1="630" y1="1291" x2="770" y2="1291" marker-end="url(#arrowOrange)"/>
    <text x="690" y="1284" font-size="10" fill="#fbbf24">复杂结果</text>
    <g class="node-group" transform="translate(770,1271)">
      <rect class="node-llm" x="0" y="0" width="200" height="40" rx="8" opacity=".85"/>
      <text x="100" y="25" text-anchor="middle" font-size="12">✨ Flash 润色回复</text>
    </g>

    <!-- 汇聚 → send_fn -->
    <line class="arrow-line green" x1="200" y1="1311" x2="200" y2="1370" marker-end="url(#arrowGreen)"/>
    <line class="arrow-line orange" x1="870" y1="1311" x2="870" y2="1370" marker-end="url(#arrowOrange)"/>
    <line class="arrow-line" x1="200" y1="1370" x2="870" y2="1370"/>
    <line class="arrow-line highlight" x1="550" y1="1370" x2="550" y2="1400"/>

    <!-- ═══ ROW 12: 发送 + 先回复后保存 ═══ -->
    <g class="node-group" transform="translate(390,1400)">
      <rect class="node-reply" x="0" y="0" width="320" height="52" rx="10" opacity=".92"/>
      <text x="160" y="20" text-anchor="middle" font-size="13" font-weight="bold">📨 先发送 + 后台异步保存</text>
      <text x="160" y="40" text-anchor="middle" font-size="11" fill="#fda4af">立即推送 → 异步写state/memory</text>
    </g>
